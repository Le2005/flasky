<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Avaliação contínua: Aula 040{% endblock %}</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    {{ moment.include_moment() }}
</head>
<body>
    <nav class="navbar navbar-inverse navbar-static-top" role="navigation">
        <div class="container page-container">
            <div class="navbar-header">
                <a class="navbar-brand" href="{{ url_for('index') }}">
                    <span class="brand-prefix">Avaliação contínua:</span>
                    <strong>Aula 040</strong>
                </a>
            </div>

            <ul class="nav navbar-nav">
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('identificacao') }}">Identificação</a></li>
                <li>
                    <a href="{{ url_for('contexto_requisicao') }}">
                        Contexto da requisição
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container page-container main-content">
        {% block page_content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
</body>
</html>
